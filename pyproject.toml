[project]
name = "tourism-geography-tutor"
version = "0.1.0"
description = "Course Brain foundation for a grounded Tourism Geography learning platform"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.1,<4",
  "pymupdf>=1.24,<2",
  # scripts/commons_images.py resizes and re-encodes sourced photography
  "pillow>=10,<13",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
